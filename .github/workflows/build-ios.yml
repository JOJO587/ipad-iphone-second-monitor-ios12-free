name: Build LegacyPadDisplay IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate xcodeproj
        working-directory: iOS
        run: xcodegen generate

      - name: Build (no signing)
        working-directory: iOS
        run: |
          xcodebuild \
            -project LegacyPadDisplay.xcodeproj \
            -scheme LegacyPadDisplay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Locate built .app
        id: locate
        working-directory: iOS
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Package as IPA
        working-directory: iOS
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LegacyPadDisplay.ipa Payload
          ls -la LegacyPadDisplay.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPadDisplay-IPA
          path: iOS/LegacyPadDisplay.ipa
          if-no-files-found: error
          retention-days: 30
